<title>Vane project card</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{overflow:hidden}
  .card{
    width:100vw;height:100vh;position:relative;overflow:hidden;
    background:radial-gradient(760px 560px at 80% 45%, rgba(240,169,75,.22), transparent 60%),
      radial-gradient(600px 500px at 8% 100%, rgba(52,118,138,.14), transparent 62%),
      linear-gradient(150deg,#0c1620,#0a1218 62%);
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;color:#f3f6f7;
    display:flex;align-items:center;
  }
  .txt{padding:0 0 0 84px;max-width:640px;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}
  .brand svg{width:38px;height:38px;fill:#f0a94b}
  .brand b{font-size:38px;letter-spacing:-.04em}
  .kick{font-size:15px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#f0a94b;margin-bottom:16px}
  h1{font-size:52px;line-height:1.04;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
  p{font-size:19px;line-height:1.5;color:#9aa6ae;max-width:34ch}
  .foot{margin-top:30px;font-size:15px;color:#6d7a83;font-weight:600}
  .falcon{position:absolute;right:-40px;top:50%;transform:translateY(-50%);height:660px;
    mix-blend-mode:lighten;z-index:1}
</style>
<div class="card">
  <div class="txt">
    <div class="brand">
      <svg viewBox="0 0 48 48"><path fill-rule="evenodd" d="M24 46 L6 7 C13 14.5 18.5 17 24 16 C29.5 17 35 14.5 42 7 Z M24 38 L15.5 19 C18.5 21.3 21.2 22.2 24 21.8 C26.8 22.2 29.5 21.3 32.5 19 Z"/></svg>
      <b>vane</b>
    </div>
    <p class="kick">Marketing, settled onchain</p>
    <h1>Get paid the second the work is proven.</h1>
    <p>A marketplace on Arc where an autonomous falcon agent verifies every result and settles USDC in seconds.</p>
    <div class="foot">Built on Arc · Settled in USDC</div>
  </div>
  <img class="falcon" src="/mascot/watching.png" alt="">
</div>
