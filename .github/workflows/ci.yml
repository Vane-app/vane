name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Contracts, agent and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`.
      #
      # Several dependencies here ship a native binary per platform — lightningcss,
      # @tailwindcss/oxide, @next/swc, esbuild, sharp. npm records only the host
      # platform's binary in the lockfile (npm/cli#4828), and this lockfile is
      # generated on Windows, so `npm ci` on Linux installs nothing it can load and
      # the app build dies on the first stylesheet.
      #
      # This trades strict lockfile reproducibility for building at all on a second
      # platform. It is also what Vercel does, which is why deploys worked while CI
      # failed on every push.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Compile contracts
        run: npm run compile -w @vane/contracts

      - name: Typecheck agent
        run: npm run typecheck -w @vane/agent

      - name: Run the decision engine
        run: npm run demo -w @vane/agent

      - name: Build app
        run: npm run build -w app
