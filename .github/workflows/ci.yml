name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel superseded runs. Cancelling saves minutes, but GitHub reports a
  # cancelled run as a failure — so a burst of pushes produced a stream of "CI failed"
  # emails for commits that were never even tested, and the real failures were
  # indistinguishable from the noise.
  cancel-in-progress: false

jobs:
  build:
    name: Contracts, agent and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible, now that the lockfile carries Linux binaries too.
      #
      # Several dependencies ship a native binary per platform — lightningcss,
      # @tailwindcss/oxide, sharp, @unrs/resolver-binding. npm records only the host
      # platform's in the lockfile (npm/cli#4828), and this one is generated on
      # Windows, so `npm ci` on Linux installed nothing loadable and the app build died
      # on the first stylesheet. Every push failed this way.
      #
      # Fixed by declaring the Linux binaries as optionalDependencies in app/package.json
      # so they are pinned for both platforms, rather than by giving up on `npm ci`.
      - name: Install
        run: npm ci

      - name: Compile contracts
        run: npm run compile -w @vane/contracts

      - name: Typecheck agent
        run: npm run typecheck -w @vane/agent

      - name: Run the decision engine
        run: npm run demo -w @vane/agent

      - name: Build app
        run: npm run build -w app
